name: Config Docs Check
on:
  pull_request:
    branches:
      - develop
      - 'release/*'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base git ref to compare against
        required: false
        default: origin/develop

defaults:
  run:
    shell: bash -leo pipefail {0}

permissions:
  contents: read
  pull-requests: write

jobs:
  config_docs_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run config/doc sync check
        id: config_doc_check
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.base_ref }}
        run: |
          python scripts/check_configworkflow_docs.py \
            --base-ref "${BASE_REF}" \
            --report-file config-docs-report.md

      - name: Update PR comment
        if: ${{ github.event_name == 'pull_request' && steps.config_doc_check.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('config-docs-report.md', 'utf8');
            const marker = '<!-- configworkflow-doc-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail if documentation drift was found
        if: ${{ steps.config_doc_check.outcome == 'failure' }}
        run: exit 1
